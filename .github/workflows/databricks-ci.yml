name: Databricks CI

on:
  pull_request:
    branches:
      - develop
      - release
      - main

permissions:
  contents: read

jobs:

  # ---------------------------------------------------------
  # 1. Validate allowed branch promotion and determine
  #    which existing environment must be integration tested.
  # ---------------------------------------------------------
  validate-promotion:
    runs-on: ubuntu-latest

    outputs:
      integration_required: ${{ steps.resolve.outputs.integration_required }}
      integration_environment: ${{ steps.resolve.outputs.integration_environment }}
      deployment_stage: ${{ steps.resolve.outputs.deployment_stage }}
      dab_target: ${{ steps.resolve.outputs.dab_target }}

    steps:
      - name: Validate promotion path
        id: resolve
        run: |
          SOURCE_BRANCH="${{ github.head_ref }}"
          TARGET_BRANCH="${{ github.base_ref }}"

          echo "Source branch: $SOURCE_BRANCH"
          echo "Target branch: $TARGET_BRANCH"

          case "$TARGET_BRANCH" in

            develop)
              if [[ "$SOURCE_BRANCH" != feature/* ]]; then
                echo "Invalid promotion path: $SOURCE_BRANCH -> $TARGET_BRANCH"
                echo "Only feature/* branches can merge into develop."
                exit 1
              fi

              echo "deployment_stage=DEV" >> "$GITHUB_OUTPUT"
              echo "dab_target=dev" >> "$GITHUB_OUTPUT"
              echo "integration_required=false" >> "$GITHUB_OUTPUT"
              ;;

            release)
              if [[ "$SOURCE_BRANCH" != "develop" ]]; then
                echo "Invalid promotion path: $SOURCE_BRANCH -> $TARGET_BRANCH"
                echo "Only develop can merge into release."
                exit 1
              fi

              echo "deployment_stage=TEST" >> "$GITHUB_OUTPUT"
              echo "dab_target=test" >> "$GITHUB_OUTPUT"

              # Before promotion to TEST, validate DEV.
              echo "integration_required=true" >> "$GITHUB_OUTPUT"
              echo "integration_environment=dev" >> "$GITHUB_OUTPUT"
              ;;

            main)
              if [[ "$SOURCE_BRANCH" != "release" ]]; then
                echo "Invalid promotion path: $SOURCE_BRANCH -> $TARGET_BRANCH"
                echo "Only release can merge into main."
                exit 1
              fi

              echo "deployment_stage=PROD" >> "$GITHUB_OUTPUT"
              echo "dab_target=prod" >> "$GITHUB_OUTPUT"

              # Before promotion to PROD, validate TEST.
              echo "integration_required=true" >> "$GITHUB_OUTPUT"
              echo "integration_environment=test" >> "$GITHUB_OUTPUT"
              ;;

            *)
              echo "Unsupported target branch: $TARGET_BRANCH"
              exit 1
              ;;
          esac


  # ---------------------------------------------------------
  # 2. Unit tests - run for every valid PR
  # ---------------------------------------------------------
  unit-tests:
    needs: validate-promotion
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Run unit tests
        run: python -m pytest tests/member/unit -v


  # ---------------------------------------------------------
  # 3. Integration tests
  #    develop -> release : test DEV
  #    release -> main    : test TEST
  # ---------------------------------------------------------
  integration-tests:
    needs: validate-promotion

    if: needs.validate-promotion.outputs.integration_required == 'true'

    runs-on: ubuntu-latest

    environment:
      name: ${{ needs.validate-promotion.outputs.integration_environment }}

    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_SERVERLESS_COMPUTE_ID: auto
      TEST_CATALOG: ${{ vars.TEST_CATALOG }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install integration test dependencies
        run: |
          python -m pip install pytest
          python -m pip install databricks-connect==17.3.14

      - name: Run member integration tests
        run: python -m pytest tests/member/integration -v